<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CNY Noble LLC | Smart Vending Services</title>

<style>
    :root {
        --navy: #0d1b2a;
        --green: #1b5e20;
        --gold: #ffcc00;
        --light: #f7f7f7;
        --white: #ffffff;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: var(--light);
        color: var(--navy);
    }

    /* HEADER */
    header {
        background: var(--navy);
        color: var(--white);
        padding: 20px 40px;
        display: flex;
        align-items: center;
        gap: 20px;
    }

    header img {
        width: 140px;
        height: auto;
    }

    header .title-block {
        display: flex;
        flex-direction: column;
    }

    header h1 {
        margin: 0;
        font-size: 38px;
        color: var(--gold);
    }

    header p {
        margin: 5px 0 0 0;
        font-size: 18px;
    }

    /* NAVIGATION */
    nav {
        background: var(--green);
        padding: 12px;
        text-align: center;
    }

    nav a {
        color: var(--white);
        margin: 0 15px;
        text-decoration: none;
        font-size: 16px;
        font-weight: bold;
    }

    /* SECTION BLOCKS */
    section {
        padding: 60px 20px;
        max-width: 1100px;
        margin: auto;
        background: var(--white);
        margin-top: 40px;
        border-radius: 12px;
        box-shadow: 0 0 12px rgba(0,0,0,0.1);
    }

    h2 {
        font-size: 32px;
        margin-bottom: 20px;
        color: var(--green);
    }

    /* SERVICES LAYOUT */
    .services-flex {
        display: flex;
        gap: 30px;
        align-items: flex-start;
        flex-wrap: wrap;
    }

    .services-text {
        flex: 1;
        min-width: 300px;
    }

    .services-img {
        flex: 1;
        min-width: 300px;
    }

    .services-img img {
        width: 100%;
        border-radius: 12px;
    }

    /* FLEX CARDS */
    .flex {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        justify-content: center;
    }

    .card {
        background: var(--white);
        padding: 20px;
        border-radius: 10px;
        width: 280px;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
        border-top: 5px solid var(--green);
    }

    .card h3 {
        margin-top: 0;
        color: var(--navy);
    }

    /* FORM */
    form {
        background: var(--white);
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
        max-width: 600px;
        margin: auto;
        border-left: 6px solid var(--green);
    }

    label {
        display: block;
        margin-top: 15px;
        font-weight: bold;
        color: var(--navy);
    }

    input, textarea {
        width: 100%;
        padding: 12px;
        margin-top: 5px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 16px;
    }

    button {
        margin-top: 20px;
        background: var(--green);
        color: var(--white);
        padding: 12px 20px;
        border: none;
        border-radius: 6px;
        font-size: 18px;
        cursor: pointer;
        font-weight: bold;
    }

    button:hover {
        background: #144d18;
    }

    /* SHOWCASE SECTION */
    #showcase {
        text-align: center;
        padding: 40px;
    }

    #showcase img {
        width: 100%;
        max-width: 1000px;
        border-radius: 12px;
        box-shadow: 0 0 12px rgba(0,0,0,0.2);
    }

    /* CONTACT SECTION — DARK OVERLAY */
    #contact {
        position: relative;
        background: url('contact-bg.jpg') center/cover no-repeat;
        color: #ffffff;
        border-radius: 12px;
        min-height: 600px;
        padding: 50px;
    }

    #contact::before {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.55);
        border-radius: 12px;
    }

    #contact * {
        position: relative;
    }

    #contact h2 {
        font-size: 48px;
        font-weight: 800;
        color: #ffffff;
    }
